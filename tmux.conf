# enable mouse
set -g mouse on

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# only this line might not be enough
set -g default-terminal "xterm-256color"

# Needs this line also to overrides the default color
set-option -ga terminal-overrides ",xterm-256color:Tc"

# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# support colors for undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# for running image.nvim
set -gq allow-passthrough on
# for auto disable image when switching window
set -g visual-activity off

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'odedlaz/tmux-onedark-theme'  # one dark theme
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'hiroppy/tmux-agent-sidebar'
# set -g @plugin 'fcsonline/tmux-thumbs'

# agent-sidebar: 預設的 prefix+e / prefix+E 會撞到 next-window 與 tmux 內建
# 的 select-layout -E，改用 a（agent）/ A
set -g @sidebar_key 'a'
set -g @sidebar_key_all 'A'
# 不要每開一個 window 就自動長出側邊欄，改成手動 prefix+a 叫出來
set -g @sidebar_auto_create 'off'
# 側邊欄寬度，預設 15%
set -g @sidebar_width '25%'
# 隱藏下方面板（Activity log / Git status 兩個分頁），只留 agent 清單
set -g @sidebar_bottom_height '0'
# 關掉桌面通知（agent 完成／要權限／出錯時的彈窗）
set -g @sidebar_notifications 'off'

