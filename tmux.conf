# status bar

# NOTE: put the script under exec path
set -g @onedark_widgets "#(status-line.sh)"

run '~/.tmux/plugins/tpm/tpm'

# --- overrides applied AFTER plugins load (last write wins) ---
# tmux-yank binds `y` to copy-pipe-and-cancel, which exits copy mode and
# snaps the view back to the bottom. Re-bind it to copy-pipe so it still
# copies to the Wayland clipboard (wl-copy) but stays at the scroll position.
bind-key -T copy-mode-vi y send-keys -X copy-pipe "wl-copy"

# 跑 claude code 的 window 顯示 session 標題，而不是 "claude"。
# Claude Code 會用 OSC 把 pane title 設成「狀態符號 + 空格 + 對話主題」
# （例如「✳ tmux window 命名」，工作中符號會換成轉圈的字元），這裡去掉
# 開頭的符號、截到 24 字。標題還沒出現（不是「符號 空格 主題」的形狀）時
# 退回目錄名。
# automatic-rename-format 只在 window 沒被手動 rename 過時生效（手動
# rename-window 會把該 window 的 automatic-rename 關掉），所以自己取過名字
# 的 window 不會被蓋掉。
set -g automatic-rename-format '#{?pane_dead,[dead],}#{?#{==:#{pane_current_command},claude},#{?#{m/r:^[^ ]+ ,#{pane_title}},#{=24:#{s/^[^ ]+ //:pane_title}},#{b:pane_current_path}},#{pane_current_command}}'
